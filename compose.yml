services:
  ark-resource-service:
    image: local/ark-resource-service:1.0
    build:
      context: .
    container_name: ark-resource-service
    restart: unless-stopped
    user: "501:20"
    environment:
      ARK_STATE_ROOT: /state
      ARK_OUTPUT_ROOT: /output
      ARK_POLL_SECONDS: "${ARK_POLL_SECONDS:-5}"
      ARK_DOWNLOAD_WORKERS: "${ARK_DOWNLOAD_WORKERS:-2}"
      ARK_EXPORT_WORKERS: "${ARK_EXPORT_WORKERS:-2}"
      ARK_PREFETCH_BUNDLES: "${ARK_PREFETCH_BUNDLES:-2}"
      ARK_MEMORY_BUDGET_MB: "${ARK_MEMORY_BUDGET_MB:-768}"
      ARK_DECODE_MEMORY_FACTOR: "${ARK_DECODE_MEMORY_FACTOR:-6}"
      ARK_CONTAINER_SHM_SIZE: "${ARK_CONTAINER_SHM_SIZE:-768m}"
      ARK_BOOTSTRAP_PACKS: "${ARK_BOOTSTRAP_PACKS:-true}"
      ARK_EXPORT_TYPES: "${ARK_EXPORT_TYPES:-image,spine,text,audio,mesh,video,masterdata}"
      ARK_TYPETREE_TYPES: "${ARK_TYPETREE_TYPES:-MonoBehaviour,Material,AnimatorController,AnimationClip,AssetBundle,GameObject,Transform,RectTransform,ParticleSystem,ParticleSystemRenderer,MeshRenderer,SkinnedMeshRenderer,SpriteRenderer,MonoScript}"
      ARK_UNPACKER_ROOT: /opt/ark-unpacker
      HOME: /tmp
    volumes:
      - /Volumes/wd/ArkResourceService:/output
      - ark-resource-state:/state
    shm_size: "${ARK_CONTAINER_SHM_SIZE:-768m}"
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ark-resource-state:
    name: ark-resource-state
